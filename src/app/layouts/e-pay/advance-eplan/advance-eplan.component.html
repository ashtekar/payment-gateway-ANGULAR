<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advance E-Plan Payment</title>
    <!-- Security Fix: Enforce HTTPS and prevent mixed content with strict CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; form-action https:; upgrade-insecure-requests; script-src 'self' https://unpkg.com https://stackpath.bootstrapcdn.com; style-src 'self' https://stackpath.bootstrapcdn.com; connect-src 'self';">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Angular dependencies -->
    <script src="https://unpkg.com/core-js/client/shim.min.js"></script>
    <script src="https://unpkg.com/zone.js@0.8.29/dist/zone.min.js"></script>
    <script src="https://unpkg.com/reflect-metadata@0.1.13/Reflect.js"></script>
    <script src="https://unpkg.com/systemjs@0.19.47/dist/system.js"></script>
    <script src="https://unpkg.com/rxjs@6.6.0/bundles/rxjs.umd.min.js"></script>
    <script src="https://unpkg.com/@angular/core@8.2.14/bundles/core.umd.js"></script>
    <script src="https://unpkg.com/@angular/common@8.2.14/bundles/common.umd.js"></script>
    <script src="https://unpkg.com/@angular/compiler@8.2.14/bundles/compiler.umd.js"></script>
    <script src="https://unpkg.com/@angular/platform-browser@8.2.14/bundles/platform-browser.umd.js"></script>
    <script src="https://unpkg.com/@angular/platform-browser-dynamic@8.2.14/bundles/platform-browser-dynamic.umd.js"></script>
    <script src="https://unpkg.com/@angular/forms@8.2.14/bundles/forms.umd.js"></script>
    <script>
      (function() {
        var ng = window.ng || {};
        ng.core = window.ng && window.ng.core ? window.ng.core : window.ng && window.ng['core'] ? window.ng['core'] : window.ng.core;
        ng.platformBrowser = window.ng && window.ng.platformBrowser ? window.ng.platformBrowser : window.ng && window.ng['platformBrowser'] ? window.ng['platformBrowser'] : window.ng.platformBrowser;
        ng.platformBrowserDynamic = window.ng && window.ng.platformBrowserDynamic ? window.ng.platformBrowserDynamic : window.ng && window.ng['platformBrowserDynamic'] ? window.ng['platformBrowserDynamic'] : window.ng.platformBrowserDynamic;
        ng.forms = window.ng && window.ng.forms ? window.ng.forms : window.ng && window.ng['forms'] ? window.ng['forms'] : window.ng.forms;

        var Component = ng.core.Component;
        var NgModule = ng.core.NgModule;
        var enableProdMode = ng.core.enableProdMode;
        var BrowserModule = ng.platformBrowser.BrowserModule;
        var FormsModule = ng.forms.FormsModule;

        enableProdMode();

        function AppComponent() {
          this.csrfToken = 'REPLACE_WITH_CSRF_TOKEN';
          this.planCost = '99.99';
          this.showMsg = false;
          this.alertType = true;
          this.responseDescription = '';
        }
        AppComponent.prototype.pay = function(formValue) {
          this.showMsg = true;
          if (formValue && formValue.accountNumber && formValue.routingNumber) {
            this.alertType = true;
            this.responseDescription = 'Payment successful!';
          } else {
            this.alertType = false;
            this.responseDescription = 'Payment failed. Please check your details.';
          }
        };
<!-- ═══════════════════════════════════════════════════════════════-->
<!-- 🔒 SECURITY FIX BY VOTAL.AI-->
<!-- ───────────────────────────────────────────────────────────────-->
<!-- Issue:    Sensitive Payment Data Collected Without Evidence of Secure Handling (CWE-311)-->
<!-- Severity: HIGH-->
<!-- Category: SensitiveData-->
<!-- Fixed:    2026-01-03T19:27:32.029Z-->
<!-- ───────────────────────────────────────────────────────────────-->
<!-- Description: Sensitive payment data is collected in the form, but there is no evidence of secure handling, maskin...-->
<!-- ═══════════════════════════════════════════════════════════════-->


        Component({
          selector: 'app-root',
          template: `
<div class="card text-center">
    <div class="card-body">
        <h5 class="card-title text-uppercase font-weight-bold">buy advance e-check plan</h5>
        <p class="mb-4">Fill the below details to complete the purchase of the selected plan</p>
        <form #form="ngForm" (ngSubmit)="pay(form.value); form.reset()" autocomplete="off" action="https://secure.example.com/payment" method="POST">
            <legend>Customer Billing Information</legend>
            <div class="input-group mb-3">
                <div class="input-group-prepend">  <!-- 🔒 FIXED: Sensitive Payment Data Collected Without Evidence of Secure Handling - See security comment above-->
                    <span class="input-group-text" id="firstName">First Name
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="First Name" aria-describedby="firstName" name="firstName" ngModel autocomplete="given-name">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="lastName">Last Name
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="Last Name" aria-describedby="lastName" name="lastName" ngModel autocomplete="family-name">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="phone">Phone
                    </span>
                </div>
                <input type="tel" class="form-control" aria-label="Phone Number" aria-describedby="phone" name="phone" ngModel autocomplete="tel">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="email">Email
                    </span>
                </div>
                <input type="email" class="form-control" aria-label="Email" aria-describedby="email" name="email" ngModel autocomplete="email">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="address">Address
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="Address" aria-describedby="address" name="address" ngModel autocomplete="street-address">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="city">City
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="City" aria-describedby="city" name="city" ngModel autocomplete="address-level2">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="state">State
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="State" aria-describedby="state" name="state" ngModel autocomplete="address-level1">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="zipCode">Zip Code
                    </span>
                </div>
                <input type="text" pattern="\\d{5}" maxlength="10" class="form-control" aria-label="Zip Code" aria-describedby="zipCode" name="zipCode" ngModel autocomplete="postal-code" inputmode="numeric">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="country">Country
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="Country" aria-describedby="country" name="country" ngModel autocomplete="country">
            </div>
            <legend class="mt-3">Payment/Authorization Information</legend>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <label class="input-group-text" for="accountType">Account Type</label>
                </div>
                <select class="custom-select" id="accountType" name="accountType" ngModel>
                    <option value="checking">Checking</option>
                    <option value="savings">Savings</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="checkNumber">
                        Check Number
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="Check number" aria-describedby="checkNumber" name="checkNumber" ngModel autocomplete="off" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="routingNumber">
                        Routing Number
                    </span>
                </div>
                <input type="password" class="form-control" aria-label="Routing number" aria-describedby="routingNumber" name="routingNumber" ngModel autocomplete="new-password" inputmode="numeric" pattern="[0-9]*" maxlength="9" minlength="9" required>
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="accountNumber">
                        Account Number
                    </span>
                </div>
                <input type="password" class="form-control" aria-label="Account number" aria-describedby="accountNumber" name="accountNumber" ngModel autocomplete="new-password" inputmode="numeric" pattern="[0-9]*" maxlength="17" minlength="4" required>
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="nameOnAccount">
                        Name on account
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="Name on account" aria-describedby="nameOnAccount" name="nameOnAccount" ngModel autocomplete="off">
            </div>
            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text" id="bankName">
                        Bank Name
                    </span>
                </div>
                <input type="text" class="form-control" aria-label="Bank name" aria-describedby="bankName" name="bankName" ngModel autocomplete="off">
            </div>
            <!-- Security Fix: Add CSRF token as hidden field (replace value with actual token in server-side rendering) -->
            <input type="hidden" name="csrfToken" [value]="csrfToken">
            <button type="submit" class="btn btn-success font-weight-bold text-uppercase w-100 mt-4 mb-2">Pay $ {{ planCost }}</button>
        </form>
    </div>
</div>

<div class="container px-0 mt-3" *ngIf="showMsg">
    <h5 [className]="alertType ? 'alert-success px-4 py-3' : 'alert-danger px-4 py-3'">{{ responseDescription }}</h5>
</div>
          `
        })(AppComponent);

        NgModule({
          imports: [BrowserModule, FormsModule],
          declarations: [AppComponent],
          bootstrap: [AppComponent]
        })(function AppModule() {});

        document.addEventListener('DOMContentLoaded', function() {
          ng.platformBrowserDynamic.platformBrowserDynamic().bootstrapModule(window.AppModule || AppModule);
        });
      })();
    </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
